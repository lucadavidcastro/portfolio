name: UNICO Arena — five agents / 12h

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unico-arena.yml'
      - 'UNICO/arena_agent.py'
      - 'UNICO/arena_reconcile.py'
      - 'UNICO/arena_controller.py'
      - 'UNICO/arena/selftest.py'
      - 'UNICO/arena/strategy.json'
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: unico-arena-12h
  cancel-in-progress: true

permissions:
  contents: write

env:
  TZ: America/Argentina/Mendoza
  OWNER_EMAIL: ${{ secrets.UNICO_OWNER_EMAIL }}
  PORTFOLIO_URL: https://lucadavidcastro.myportfolio.com/
  TARGET_USD: '5000'
  DEADLINE: '2026-10-31'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ARENA_END: '2026-09-18T11:33:00-03:00'
  ARENA_TARGET_USD: '100'

jobs:
  audit:
    name: Arena preflight audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile UNICO/arena_agent.py UNICO/arena_reconcile.py UNICO/arena/selftest.py
      - name: Run architecture self-test
        run: python3 UNICO/arena/selftest.py
      - name: Verify required secrets
        run: |
          test -n "$OWNER_EMAIL" || { echo 'MISSING_SECRET: UNICO_OWNER_EMAIL'; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo 'MISSING_SECRET: OPENAI_API_KEY'; exit 1; }
          openssl version
          echo ARENA_PREFLIGHT_OK

  arena:
    name: Arena lane — ${{ matrix.lane }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [sniper, research, creative, builder, premium]
    env:
      UNICO_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - name: Run five-agent revenue lane
        run: python3 UNICO/arena_agent.py
      - name: Upload lane state and encrypted token
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arena-${{ matrix.lane }}
          path: |
            UNICO/arena/${{ matrix.lane }}.json
            UNICO/arena/${{ matrix.lane }}.log
            UNICO/arena/${{ matrix.lane }}.vault
          if-no-files-found: warn
          retention-days: 7

  reconcile:
    name: Arena reconcile and retirement gate
    needs: arena
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download all lane states
        uses: actions/download-artifact@v4
        with:
          pattern: arena-*
          path: UNICO/arena
          merge-multiple: true
      - name: Reconcile verified revenue
        run: python3 UNICO/arena_reconcile.py
      - name: Persist audited state and encrypted token vaults
        run: |
          set -e
          git config user.name 'UNICO Arena'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UNICO/runtime.json UNICO/arena
          git diff --cached --quiet && exit 0
          git commit -m "UNICO arena reconcile $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep 2
          done
          echo 'ARENA_PERSIST_PUSH_FAILED' >&2
          exit 1
